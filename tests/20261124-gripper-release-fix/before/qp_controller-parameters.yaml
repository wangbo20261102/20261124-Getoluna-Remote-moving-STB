/qp_controller:
  ros__parameters:
    base_pose_frame: tracking_base_link
    base_pose_topic: info/base_pose
    body_joint_num: 6
    collision_detection_distance: 0.15
    collision_minimum_distance: 0.005
    collision_pairs: []
    collision_pairs_file: luna/collision_pairs.json
    com_target: com_marker
    control_frequency_hz: 500.0
    damping_cost: 0.2
    debug: false
    enable_viewer: false
    go_home_joint_speed: 0.3
    go_home_min_duration: 1.0
    head_target: head_target
    ik_head_joint_count: 2
    ik_request_default_frame: base_link
    ik_request_mux_active_source_topic: info/ik_request_mux/active_source
    ik_request_timeout: 0.5
    ik_request_topic: control/ik_request
    ik_result_topic: control/ik_result
    ik_tasks_file: luna/ik_tasks.yaml
    joint_cmd_mux_active_source_topic: info/joint_cmd_mux/active_source
    joint_cmd_mux_latest_joint_cmd_topic: info/joint_cmd_mux/latest_joint_cmd
    joint_cmd_mux_qp_source_index: 0
    joint_cmd_mux_switch_seed_joint_cmd_topic: info/joint_cmd_mux/switch_seed_joint_cmd
    joint_cmd_output_prefix: control/qp_controller
    joint_cmd_output_ramp_duration: 2.0
    joint_smoother_w: 30.0
    joint_smoother_z: 1.0
    kinetic_cost: 0.0001
    left_hand_target: left_tool_target
    mink_scene_file: Gento_Luna/scene_teleop_luna.xml
    pelvis_target: pelvis_target
    posture_cost: 0.5
    publish_ik_result: false
    publish_joint_cmd: true
    publish_zmp_debug: true
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    qp_damping: 0.1
    qp_solver: daqp
    require_go_home_on_startup: true
    require_robot_movable_for_ik_request: true
    right_hand_target: right_tool_target
    robot_joint_feedback_topic: info/joint_feedback
    support_frame_enabled: true
    support_frame_filter_alpha: 0.2
    support_frame_marker_topic: info/collision_marker
    support_frame_source: pelvis
    support_frame_use_z: true
    sync_from_latest_joint_cmd_on_startup: true
    sync_from_robot_feedback_on_startup: true
    sync_on_qp_mux_switch: true
    torso_target: torso_target
    upper_body_ik_markers_topic: info/upper_body_ik_result_markers
    upper_body_ik_result_topic: info/upper_body_ik_result
    use_sim_time: false
    velocity_limits_file: luna/velocity_limits.json
    visual_output_frame: base_link

